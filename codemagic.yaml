workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mystatus.tokimemo
    scripts:
      - flutter pub get
      - flutter build ipa --release
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: ios-build
        key_id: 3ZQ6STLB2Q
        issuer_id: 2a4be50c-7608-4732-8a8c-26a27e134c69
    
